name: Build and deploy SvelteKit site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies for high-severity advisories
        run: npm audit --audit-level=high

      - name: Check Svelte files
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Check internal links in the generated site
        run: node scripts/check-static-links.js

      - name: Syntax-check responsive browser QA
        run: |
          node --check scripts/check-responsive.mjs
          node --check scripts/check-accessibility.mjs
          node --check scripts/capture-project-previews.mjs

      - name: Run generated-site smoke tests
        run: npm test

      - name: Install pinned Playwright for live project previews
        continue-on-error: true
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1

      - name: Install Chromium for live project previews
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Capture authentic live application previews
        continue-on-error: true
        run: node scripts/capture-project-previews.mjs

      - name: Upload project preview screenshots and capture report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: project-interface-previews
          path: artifacts/project-previews/
          if-no-files-found: warn
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
