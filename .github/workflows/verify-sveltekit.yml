name: Verify SvelteKit site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, improve/portfolio-quality-ci]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check Svelte files
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Run generated-site smoke tests
        run: npm test
