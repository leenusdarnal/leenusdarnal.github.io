name: Verify SvelteKit site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'improve/**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies for high-severity advisories
        run: npm audit --audit-level=high

      - name: Check Svelte files
        run: npm run check

      - name: Syntax-check configuration publisher
        run: node --check scripts/publish-personal-space-config.mjs

      - name: Syntax-check responsive browser QA
        run: |
          node --check scripts/check-responsive.mjs
          node --check scripts/check-accessibility.mjs
          node --check scripts/capture-project-previews.mjs

      - name: Build static site
        run: npm run build

      - name: Check internal links in the generated site
        run: node scripts/check-static-links.js

      - name: Run generated-site smoke tests
        run: npm test
