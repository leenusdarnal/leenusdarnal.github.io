name: Responsive browser QA

on:
  workflow_run:
    workflows:
      - Build and deploy SvelteKit site to GitHub Pages
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read

concurrency:
  group: responsive-browser-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout deployed source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned browser QA tools
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1 axe-core@4.14.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify browser test script syntax
        run: |
          node --check scripts/check-responsive.mjs
          node --check scripts/check-accessibility.mjs

      - name: Test live homepage across viewport profiles
        env:
          SITE_URL: https://leenusdarnal.github.io/
        run: node scripts/check-responsive.mjs

      - name: Run WCAG 2.2 A/AA and keyboard accessibility checks
        env:
          SITE_URL: https://leenusdarnal.github.io/
        run: node scripts/check-accessibility.mjs

      - name: Upload responsive screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: responsive-and-accessibility-qa
          path: artifacts/responsive/
          if-no-files-found: warn
          retention-days: 14
