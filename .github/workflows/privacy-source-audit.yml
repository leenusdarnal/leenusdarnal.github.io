name: Linked application privacy source audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 1 * *'
  push:
    branches: [main]
    paths:
      - 'scripts/audit-linked-app-privacy.mjs'
      - 'tests/privacy-source-audit.test.js'
      - '.github/workflows/privacy-source-audit.yml'
      - 'docs/PROJECT-PRIVACY-REVIEW.md'

permissions:
  contents: read

concurrency:
  group: linked-app-privacy-source-audit
  cancel-in-progress: true

jobs:
  source-audit:
    name: Scan linked app source patterns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the homepage audit runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out PixelForge Studio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: leenusdarnal/pixelforge-studio
          ref: main
          path: audit-targets/pixelforge-studio
          persist-credentials: false

      - name: Check out PixelCutout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: leenusdarnal/pixelcutout
          ref: main
          path: audit-targets/pixelcutout
          persist-credentials: false

      - name: Check out Salary Calculator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: leenusdarnal/SIKKIM-GOVERNMENT-SALARY-CALCULATOR
          ref: main
          path: audit-targets/salary-calculator
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Run source-pattern scan
        run: node scripts/audit-linked-app-privacy.mjs

      - name: Upload dated source audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linked-app-privacy-source-audit
          path: artifacts/privacy-source-audit/
          if-no-files-found: warn
          retention-days: 90
