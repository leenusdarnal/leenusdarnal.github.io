name: Lighthouse quality audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build and deploy SvelteKit site to GitHub Pages
    types: [completed]
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

concurrency:
  group: lighthouse-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Lighthouse against GitHub Pages
        run: |
          npx --yes lighthouse@12.8.2 https://leenusdarnal.github.io/ \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=./lighthouse-report.json

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summarise audit scores and enforce quality floor
        if: always() && hashFiles('lighthouse-report.json') != ''
        run: node scripts/report-lighthouse.js
