name: Feature request
description: Suggest a focused improvement to the personal website.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the visitor problem or workflow the change would improve. Do not include personal data or private project files.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain the need rather than prescribing a particular implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behaviour
      description: Describe what a useful outcome would look like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
