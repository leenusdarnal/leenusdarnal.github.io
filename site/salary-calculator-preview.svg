<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Sikkim Government Salary Calculator preview</title>
  <desc id="desc">Illustrative preview of the calculator's opening screen, with pay level, basic pay and dearness allowance inputs.</desc>
  <rect width="960" height="540" fill="#f5f7f5"/>
  <rect width="960" height="62" fill="#fff"/>
  <path d="M0 61.5H960" stroke="#dce5df"/>
  <rect x="34" y="15" width="32" height="32" rx="9" fill="#167650"/>
  <rect x="43" y="22" width="14" height="19" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M46 28h8M46 33h8M46 37h4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="78" y="27" fill="#167650" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">SIKKIM GOVERNMENT</text>
  <text x="78" y="43" fill="#17231d" font-family="Arial,sans-serif" font-size="12" font-weight="700">PAY &amp; ALLOWANCES</text>
  <rect x="836" y="18" width="92" height="27" rx="14" fill="#f4f7f5" stroke="#dbe3dd"/>
  <text x="859" y="35" fill="#52645a" font-family="Arial,sans-serif" font-size="10">Light mode</text>
  <text x="48" y="102" fill="#167650" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">REFERENCE CALCULATOR</text>
  <text x="48" y="145" fill="#17231d" font-family="Arial,sans-serif" font-size="31" font-weight="700">Calculate your monthly salary</text>
  <text x="48" y="174" fill="#52645a" font-family="Arial,sans-serif" font-size="14">Choose a pay level, basic-pay cell and DA rate to estimate gross salary,</text>
  <text x="48" y="195" fill="#52645a" font-family="Arial,sans-serif" font-size="14">deductions and monthly in-hand pay.</text>
  <rect x="48" y="222" width="360" height="280" rx="13" fill="#fff" stroke="#dce5df"/>
  <rect x="438" y="222" width="474" height="280" rx="13" fill="#fff" stroke="#dce5df"/>
  <text x="70" y="254" fill="#17231d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Salary details</text>
  <text x="70" y="277" fill="#65746b" font-family="Arial,sans-serif" font-size="11">Select the details used for your estimate.</text>
  <g font-family="Arial,sans-serif">
    <text x="70" y="309" fill="#53645a" font-size="9" font-weight="700">PAY LEVEL</text>
    <rect x="70" y="318" width="316" height="37" rx="7" fill="#fbfcfb" stroke="#ccd8d0"/>
    <text x="84" y="342" fill="#17231d" font-size="12">Select Pay Level</text>
    <text x="70" y="378" fill="#53645a" font-size="9" font-weight="700">BASIC PAY</text>
    <rect x="70" y="387" width="316" height="37" rx="7" fill="#fbfcfb" stroke="#ccd8d0"/>
    <text x="84" y="411" fill="#17231d" font-size="12">Select Basic Pay</text>
    <text x="70" y="447" fill="#53645a" font-size="9" font-weight="700">DEARNESS ALLOWANCE (DA)</text>
    <rect x="70" y="456" width="316" height="34" rx="7" fill="#fbfcfb" stroke="#ccd8d0"/>
    <text x="84" y="478" fill="#17231d" font-size="12">58.0%  ▼</text>
  </g>
  <text x="464" y="257" fill="#167650" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".7">YOUR ESTIMATE</text>
  <text x="464" y="296" fill="#17231d" font-family="Arial,sans-serif" font-size="24" font-weight="700">Ready when you are</text>
  <text x="464" y="322" fill="#65746b" font-family="Arial,sans-serif" font-size="12">Choose a pay level and basic-pay cell to begin.</text>
  <g font-family="Arial,sans-serif">
    <rect x="464" y="354" width="124" height="57" rx="9" fill="#f4f8f5" stroke="#dce5df"/>
    <rect x="600" y="354" width="124" height="57" rx="9" fill="#f4f8f5" stroke="#dce5df"/>
    <rect x="736" y="354" width="150" height="57" rx="9" fill="#f4f8f5" stroke="#dce5df"/>
    <text x="478" y="376" fill="#167650" font-size="10" font-weight="700">01</text><text x="478" y="394" fill="#17231d" font-size="12" font-weight="700">Pay level</text>
    <text x="614" y="376" fill="#167650" font-size="10" font-weight="700">02</text><text x="614" y="394" fill="#17231d" font-size="12" font-weight="700">Basic pay</text>
    <text x="750" y="376" fill="#167650" font-size="10" font-weight="700">03</text><text x="750" y="394" fill="#17231d" font-size="12" font-weight="700">Calculate</text>
  </g>
  <path d="M464 435H886" stroke="#e5ebe6"/>
  <text x="464" y="460" fill="#17231d" font-family="Arial,sans-serif" font-size="12" font-weight="700">23 pay levels</text>
  <text x="464" y="480" fill="#65746b" font-family="Arial,sans-serif" font-size="11">40 cells per level · Mobile friendly</text>
</svg>
