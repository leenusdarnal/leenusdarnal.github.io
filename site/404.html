<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111614">
  <title>Page not found — Leenus Darnal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script>
    (() => {
      let saved = null;
      try { saved = localStorage.getItem('site-theme'); } catch (_) {}
      const light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : (light ? 'light' : 'dark');
    })();
  </script>
  <script src="/theme.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="topbar"><a class="site-name" href="/">Leenus Darnal</a></header>
    <main id="main-content" class="intro">
      <p class="eyebrow">404 · PAGE NOT FOUND</p>
      <h1>This page seems to have wandered off.</h1>
      <p class="intro-copy">The link may be old, or the page may have moved. You can head back to the homepage.</p>
      <p><a href="/">← Back to the homepage</a></p>
    </main>
    <footer class="footer"><span>Leenus Darnal</span><span>Made to keep useful things close.</span></footer>
  </div>
</body>
</html>
